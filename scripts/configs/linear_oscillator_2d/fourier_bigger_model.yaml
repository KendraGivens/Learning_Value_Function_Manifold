coordinate_dim: 2
latent_dim: 128

decoder_hidden_dim: 256
pnode_hidden_dim: 256
decoder_num_layers: 5
input_scale: 16.0

method: dopri5
rtol: 1.0e-7
atol: 1.0e-9

T: 1.0
omega: 1.0
u_bound: 1.0
d_bound: 0.5
beta: 0.25

x1_bounds: [-1.0, 1.0]
x2_bounds: [-1.0, 1.0]

num_batches: 1000
num_interior: 4096
num_terminal: 4096

scale_to_minus1_1: true
scale_time_to_01: true

lr: 1.0e-4
net_type: fourier
pretrain_steps: 2000
steps_per_stage: 500
tau_schedule: [0.05, 0.1, 0.2, 0.4, 0.7, 1.0]